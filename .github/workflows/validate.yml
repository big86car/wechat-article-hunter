name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check skill frontmatter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path("skills").glob("*/SKILL.md"):
              text = path.read_text(encoding="utf-8")
              assert text.startswith("---\n"), f"missing frontmatter: {path}"
              frontmatter = text.split("---", 2)[1]
              assert re.search(r"^name:\s*[a-z0-9-]+$", frontmatter, re.M), path
              assert re.search(r"^description:\s*\S", frontmatter, re.M), path
              assert "TODO" not in frontmatter, path
          PY
